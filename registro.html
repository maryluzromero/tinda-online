
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario - Hilo Urbano</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>HILO URBANO</h1>
        <p>Tu estilo, tu identidad</p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Crear una cuenta</h2>
            <p>Regístrate para conocer nuestros productos.</p>

            <form action="#" method="post">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                       placeholder="Escribe tu correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena"
                       placeholder="Crea una contraseña" required>

                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar"
                       placeholder="Repite tu contraseña" required>

                <button type="submit">Registrarme</button>
            </form>

            <p>¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hilo Urbano - Tienda Online de Camisas</p>
        <p>MARY LUZMINDA ROMERO LEGUIZAMON FICHA: 3186695</p>
    </footer>

</body>
</html>
